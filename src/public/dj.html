<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="CloudDJ (Pilar 06) - Mezclador Multimedia Virtual en Vivo | Mezcla música en tiempo real desde YouTube, TikTok y enlaces web con tornamesas dobles, crossfader, ecualizador y cola de reproducción.">
  <meta property="og:title" content="CloudDJ - Mezclador Virtual en Vivo y Cola de Pistas (Pilar 06)">
  <meta property="og:description" content="Sé un DJ en la nube: carga enlaces de YouTube o TikTok, mezcla dos pistas con crossfader, ecualizadores, scratch y cola de reproducción continua.">
  <title>CloudDJ - Mezclador Virtual en Vivo & Cola de Pistas (Pilar 06) - CloudTranslator</title>
  <link rel="icon" type="image/png" sizes="192x192" href="/img/logo.png">
  <link rel="icon" type="image/png" sizes="64x64" href="/img/logo.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/img/logo.png">

  <link rel="stylesheet" href="/css/style.css">
  <script>
    (function(){try{var m=document.cookie.match(/(?:^|; )cloud_translator_lang=([^;]*)/);var l=m?decodeURIComponent(m[1]):null;if(l&&l!=="original"&&l!=="es"){document.documentElement.classList.add("ct-pending");setTimeout(function(){document.documentElement.classList.remove("ct-pending");},800);}}catch(e){}})();
  </script>
  <script src="/js/spa-router.js" defer></script>
  <script src="/components/components.js" defer></script>
  <style>
    /* Estilos del Módulo CloudDJ */
    .dj-console {
      background: radial-gradient(circle at 50% 0%, rgba(20, 26, 42, 0.95), rgba(8, 10, 16, 0.98));
      border: 1px solid var(--border-subtle);
      border-radius: 18px;
      padding: 24px;
      box-shadow: 0 16px 48px rgba(0, 0, 0, 0.6);
      margin-bottom: 32px;
    }
    .dj-decks-grid {
      display: grid;
      grid-template-columns: 1fr 280px 1fr;
      gap: 20px;
      align-items: stretch;
    }
    @media (max-width: 1024px) {
      .dj-decks-grid {
        grid-template-columns: 1fr;
      }
    }
    .dj-deck-card {
      background: rgba(14, 18, 30, 0.85);
      border: 1px solid var(--border-subtle);
      border-radius: 14px;
      padding: 20px;
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      overflow: hidden;
    }
    .dj-deck-card.deck-a {
      border-top: 3px solid var(--primary);
    }
    .dj-deck-card.deck-b {
      border-top: 3px solid #ff007b;
    }
    .turntable-wrapper {
      position: relative;
      width: 190px;
      height: 190px;
      margin: 16px auto;
      cursor: grab;
      user-select: none;
    }
    .turntable-wrapper:active {
      cursor: grabbing;
    }
    .vinyl-platter {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: repeating-radial-gradient(circle, #111, #111 2px, #1a1a1a 3px, #1a1a1a 4px);
      border: 6px solid #222;
      box-shadow: 0 0 25px rgba(0, 0, 0, 0.8), inset 0 0 15px rgba(0, 0, 0, 0.9);
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.05s linear;
    }
    .vinyl-platter.spinning {
      animation: spinPlatter 2.8s linear infinite;
    }
    .vinyl-label {
      width: 70px;
      height: 70px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--primary), #0077ff);
      border: 3px solid #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.65rem;
      font-weight: 800;
      color: #000;
      text-align: center;
    }
    .deck-b .vinyl-label {
      background: linear-gradient(135deg, #ff007b, #c026d3);
      color: #fff;
    }
    .vinyl-needle {
      position: absolute;
      top: -8px;
      right: -8px;
      width: 48px;
      height: 74px;
      pointer-events: none;
      transform-origin: top right;
      transition: transform 0.3s ease;
    }
    .spinning ~ .vinyl-needle {
      transform: rotate(18deg);
    }
    @keyframes spinPlatter {
      100% { transform: rotate(360deg); }
    }
    .dj-central-mixer {
      background: rgba(10, 13, 22, 0.9);
      border: 1px solid var(--border-subtle);
      border-radius: 14px;
      padding: 18px 14px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.6);
    }
    .crossfader-container {
      width: 100%;
      background: rgba(0, 0, 0, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 10px;
      padding: 14px 12px;
      margin-top: 18px;
      text-align: center;
    }
    .crossfader-slider {
      -webkit-appearance: none;
      width: 100%;
      height: 12px;
      border-radius: 6px;
      background: linear-gradient(90deg, var(--primary), rgba(255, 255, 255, 0.3), #ff007b);
      outline: none;
      cursor: pointer;
    }
    .crossfader-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 32px;
      height: 28px;
      border-radius: 4px;
      background: #ffffff;
      border: 2px solid #000;
      box-shadow: 0 0 12px rgba(255, 255, 255, 0.5);
      cursor: grab;
    }
    .crossfader-slider::-webkit-slider-thumb:active {
      cursor: grabbing;
    }
    .eq-knob-group {
      display: flex;
      justify-content: space-around;
      width: 100%;
      margin: 12px 0;
      gap: 6px;
    }
    .eq-slider-col {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      flex: 1;
    }
    .eq-slider-col label {
      font-size: 0.68rem;
      font-weight: 800;
      color: var(--text-muted);
    }
    .eq-slider-v {
      -webkit-appearance: slider-vertical;
      writing-mode: bt-lr;
      width: 24px;
      height: 70px;
      cursor: pointer;
    }
    .deck-btn-row {
      display: flex;
      gap: 8px;
      justify-content: center;
      margin-top: 14px;
      flex-wrap: wrap;
    }
    .btn-cue, .btn-play-deck, .btn-sync {
      padding: 10px 18px;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 800;
      border: 1px solid var(--border-subtle);
      background: rgba(255, 255, 255, 0.05);
      color: #fff;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
    }
    .btn-play-deck.active {
      background: #10b981;
      border-color: #10b981;
      color: #000;
      box-shadow: 0 0 14px rgba(16, 185, 129, 0.5);
    }
    .btn-cue:active {
      background: #f59e0b;
      color: #000;
    }
    .queue-card {
      background: rgba(14, 18, 30, 0.85);
      border: 1px solid var(--border-subtle);
      border-radius: 14px;
      padding: 24px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
      margin-bottom: 32px;
    }
    .queue-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 16px;
      background: rgba(0, 0, 0, 0.35);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 10px;
      margin-bottom: 8px;
      transition: all 0.2s ease;
    }
    .queue-item:hover {
      border-color: rgba(0, 240, 255, 0.3);
      background: rgba(0, 240, 255, 0.04);
    }
    .queue-item.current-a {
      border-left: 4px solid var(--primary);
    }
    .queue-item.current-b {
      border-left: 4px solid #ff007b;
    }
  </style>
</head>
<body>

  <!-- Pie de Página Modular (Componente Centralizado) -->
  <footer id="footer-placeholder" data-component="footer" data-active="dj"></footer>

  <!-- Elementos de Audio HTML5 para cada Deck -->
  <audio id="audio-deck-a" preload="auto"></audio>
  <audio id="audio-deck-b" preload="auto"></audio>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const audioA = document.getElementById("audio-deck-a");
      const audioB = document.getElementById("audio-deck-b");

      // Web Audio API Context para Ecualizadores y Mezcla
      let audioCtx = null;
      let sourceA, sourceB;
      let gainA, gainB;
      let eqHiA, eqMidA, eqLowA;
      let eqHiB, eqMidB, eqLowB;

      function initWebAudio() {
        if (audioCtx) return;
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        audioCtx = new AudioContext();

        // Nodos Deck A
        sourceA = audioCtx.createMediaElementSource(audioA);
        gainA = audioCtx.createGain();
        eqHiA = audioCtx.createBiquadFilter();
        eqHiA.type = "highshelf";
        eqHiA.frequency.value = 3500;
        eqMidA = audioCtx.createBiquadFilter();
        eqMidA.type = "peaking";
        eqMidA.frequency.value = 1500;
        eqLowA = audioCtx.createBiquadFilter();
        eqLowA.type = "lowshelf";
        eqLowA.frequency.value = 250;

        sourceA.connect(eqLowA);
        eqLowA.connect(eqMidA);
        eqMidA.connect(eqHiA);
        eqHiA.connect(gainA);
        gainA.connect(audioCtx.destination);

        // Nodos Deck B
        sourceB = audioCtx.createMediaElementSource(audioB);
        gainB = audioCtx.createGain();
        eqHiB = audioCtx.createBiquadFilter();
        eqHiB.type = "highshelf";
        eqHiB.frequency.value = 3500;
        eqMidB = audioCtx.createBiquadFilter();
        eqMidB.type = "peaking";
        eqMidB.frequency.value = 1500;
        eqLowB = audioCtx.createBiquadFilter();
        eqLowB.type = "lowshelf";
        eqLowB.frequency.value = 250;

        sourceB.connect(eqLowB);
        eqLowB.connect(eqMidB);
        eqMidB.connect(eqHiB);
        eqHiB.connect(gainB);
        gainB.connect(audioCtx.destination);

        updateCrossfader(document.getElementById("crossfader").value);
      }

      // Cola de Pistas ("Lo que va a ir después")
      let djQueue = [
        {
          id: "q1",
          title: "Rick Astley - Never Gonna Give You Up (Remaster)",
          artist: "Rick Astley",
          platform: "YouTube",
          duration: "03:33",
          url: "https://www.youtube.com/watch?v=dQw4w9WgXcQ",
          streamUrl: null
        },
        {
          id: "q2",
          title: "Synthwave Cyber Beat 2026",
          artist: "CloudDJ Demo",
          platform: "Web Audio",
          duration: "02:45",
          url: "https://example.com/synthwave.mp3",
          streamUrl: null
        },
        {
          id: "q3",
          title: "Future Funk Electro Groove",
          artist: "CloudDJ Demo",
          platform: "Web Audio",
          duration: "03:15",
          url: "https://example.com/futurefunk.mp3",
          streamUrl: null
        }
      ];

      function renderQueue() {
        const container = document.getElementById("queue-list-container");
        container.innerHTML = "";
        document.getElementById("queue-counter").textContent = `${djQueue.length} pistas preparadas en lista`;

        if (djQueue.length === 0) {
          container.innerHTML = `<div style="text-align: center; padding: 24px; color: var(--text-muted);">No hay canciones en la cola. Pega un enlace arriba para agregar.</div>`;
          return;
        }

        djQueue.forEach((item, index) => {
          const el = document.createElement("div");
          el.className = "queue-item";
          el.innerHTML = `
            <div style="display: flex; align-items: center; gap: 12px; min-width: 0; flex: 1;">
              <span style="font-weight: 800; font-size: 0.95rem; color: var(--primary); width: 24px;">#${index + 1}</span>
              <div style="min-width: 0;">
                <div style="font-weight: 700; font-size: 0.95rem; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">${item.title}</div>
                <div style="font-size: 0.78rem; color: var(--text-muted);">${item.artist} &bull; ${item.platform} &bull; ${item.duration}</div>
              </div>
            </div>

            <div style="display: flex; gap: 6px; align-items: center; flex-wrap: wrap;">
              <button class="action-btn" style="color: var(--primary); border-color: rgba(0, 240, 255, 0.3);" onclick="loadQueueItemToDeck('${item.id}', 'A')">Deck A</button>
              <button class="action-btn" style="color: #ff007b; border-color: rgba(255, 0, 123, 0.3);" onclick="loadQueueItemToDeck('${item.id}', 'B')">Deck B</button>
              <button class="action-btn" onclick="moveQueueItem(${index}, -1)" title="Subir" style="display: inline-flex; align-items: center; justify-content: center; padding: 6px 10px;">
                <svg class="icon" viewBox="0 0 24 24" style="width: 13px; height: 13px;"><polyline points="18 15 12 9 6 15"/></svg>
              </button>
              <button class="action-btn" onclick="moveQueueItem(${index}, 1)" title="Bajar" style="display: inline-flex; align-items: center; justify-content: center; padding: 6px 10px;">
                <svg class="icon" viewBox="0 0 24 24" style="width: 13px; height: 13px;"><polyline points="6 9 12 15 18 9"/></svg>
              </button>
              <button class="action-btn" style="color: #ff4d4d; display: inline-flex; align-items: center; justify-content: center; padding: 6px 10px;" onclick="removeQueueItem('${item.id}')" title="Eliminar">
                <svg class="icon" viewBox="0 0 24 24" style="width: 13px; height: 13px;"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
              </button>
            </div>
          `;
          container.appendChild(el);
        });
      }

      window.moveQueueItem = (index, dir) => {
        const target = index + dir;
        if (target < 0 || target >= djQueue.length) return;
        const temp = djQueue[index];
        djQueue[index] = djQueue[target];
        djQueue[target] = temp;
        renderQueue();
      };

      window.removeQueueItem = (id) => {
        djQueue = djQueue.filter(i => i.id !== id);
        renderQueue();
      };

      document.getElementById("btn-clear-queue").addEventListener("click", () => {
        djQueue = [];
        renderQueue();
      });

      document.getElementById("btn-load-presets").addEventListener("click", () => {
        djQueue = [
          {
            id: "q_" + Date.now() + "_1",
            title: "Rick Astley - Never Gonna Give You Up (Remaster)",
            artist: "Rick Astley",
            platform: "YouTube",
            duration: "03:33",
            url: "https://www.youtube.com/watch?v=dQw4w9WgXcQ"
          },
          {
            id: "q_" + Date.now() + "_2",
            title: "Electro Cyber Dance Session 2026",
            artist: "CloudDJ Hit",
            platform: "TikTok",
            duration: "02:20",
            url: "https://www.tiktok.com/@tiktok/video/7106594312292453678"
          }
        ];
        renderQueue();
      });

      // Añadir pista desde campo "Colocar Pista Siguiente"
      const inputUpNext = document.getElementById("input-up-next-url");
      const btnAddQueue = document.getElementById("btn-add-to-queue");
      const btnLoadToDeckA = document.getElementById("btn-load-to-deck-a");
      const btnLoadToDeckB = document.getElementById("btn-load-to-deck-b");
      const btnClearUpNext = document.getElementById("btn-clear-up-next");
      const platformHoverLabel = document.getElementById("platform-hover-label");
      const detectedPlatformBadge = document.getElementById("detected-platform-badge");

      const platformNames = {
        youtube: "YouTube",
        tiktok: "TikTok",
        instagram: "Instagram",
        facebook: "Facebook",
        twitter: "Twitter / X",
        pinterest: "Pinterest",
        direct: "Enlace Directo"
      };

      function detectPlatformFromUrl(url) {
        const u = (url || "").trim().toLowerCase();
        if (!u) return null;
        if (u.includes("youtube.com") || u.includes("youtu.be")) return "youtube";
        if (u.includes("tiktok.com")) return "tiktok";
        if (u.includes("instagram.com")) return "instagram";
        if (u.includes("facebook.com") || u.includes("fb.watch")) return "facebook";
        if (u.includes("twitter.com") || u.includes("x.com")) return "twitter";
        if (u.includes("pinterest.com") || u.includes("pin.it")) return "pinterest";
        if (u.startsWith("http://") || u.startsWith("https://")) return "direct";
        return null;
      }

      function syncDetectedPlatform(url) {
        const detected = detectPlatformFromUrl(url);
        document.querySelectorAll(".platform-chip").forEach(c => {
          if (detected && c.getAttribute("data-platform") === detected) {
            c.classList.add("active");
          } else {
            c.classList.remove("active");
          }
        });

        if (detected && platformNames[detected]) {
          if (detectedPlatformBadge) detectedPlatformBadge.textContent = `${platformNames[detected]} DETECTADO`;
          if (platformHoverLabel) platformHoverLabel.textContent = platformNames[detected];
        } else {
          if (detectedPlatformBadge) detectedPlatformBadge.textContent = "DETECCIÓN AUTOMÁTICA";
          if (platformHoverLabel) platformHoverLabel.textContent = "7 PLATAFORMAS";
        }
      }

      if (inputUpNext) {
        inputUpNext.addEventListener("input", () => {
          syncDetectedPlatform(inputUpNext.value);
        });
      }

      if (btnClearUpNext) {
        btnClearUpNext.addEventListener("click", () => {
          inputUpNext.value = "";
          syncDetectedPlatform("");
          inputUpNext.focus();
        });
      }

      document.querySelectorAll(".platform-chip").forEach(chip => {
        chip.addEventListener("click", () => {
          inputUpNext.focus();
        });
      });

      async function fetchMediaAndAdd(url, targetDeck = null) {
        if (!url) {
          alert("Por favor ingresa una URL válida.");
          return;
        }

        const cleanUrl = url.trim();
        const placeholderId = "q_" + Date.now();
        const newItem = {
          id: placeholderId,
          title: "Analizando enlace...",
          artist: "Cargando audio",
          platform: "Multimedia",
          duration: "--:--",
          url: cleanUrl
        };

        if (!targetDeck) {
          djQueue.push(newItem);
          renderQueue();
        }

        try {
          const res = await fetch("/api/media/convert", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ url: cleanUrl, format: "mp3", quality: "320k" })
          });
          const data = await res.json();

          if (data.status === "success") {
            newItem.title = data.title;
            newItem.artist = data.author || "Artista";
            newItem.platform = data.platform;
            newItem.duration = data.duration;
            newItem.streamUrl = data.streamUrl;

            if (targetDeck === "B") {
              loadTrackToDeck(newItem, "B");
            } else if (targetDeck === "A") {
              loadTrackToDeck(newItem, "A");
            } else {
              renderQueue();
            }
          } else {
            alert(data.error || "No se pudo cargar la canción.");
            djQueue = djQueue.filter(i => i.id !== placeholderId);
            renderQueue();
          }
        } catch (err) {
          alert("Error de conexión: " + err.message);
          djQueue = djQueue.filter(i => i.id !== placeholderId);
          renderQueue();
        }
      }

      if (btnLoadToDeckA) {
        btnLoadToDeckA.addEventListener("click", () => {
          const u = inputUpNext.value.trim();
          if (u) {
            fetchMediaAndAdd(u, "A");
            inputUpNext.value = "";
            syncDetectedPlatform("");
          }
        });
      }

      btnAddQueue.addEventListener("click", () => {
        const u = inputUpNext.value.trim();
        if (u) {
          fetchMediaAndAdd(u, null);
          inputUpNext.value = "";
          syncDetectedPlatform("");
        }
      });

      btnLoadToDeckB.addEventListener("click", () => {
        const u = inputUpNext.value.trim();
        if (u) {
          fetchMediaAndAdd(u, "B");
          inputUpNext.value = "";
          syncDetectedPlatform("");
        }
      });

      window.loadQueueItemToDeck = async (id, deck) => {
        const item = djQueue.find(i => i.id === id);
        if (!item) return;

        if (item.streamUrl) {
          loadTrackToDeck(item, deck);
        } else {
          await fetchMediaAndAdd(item.url, deck);
        }
      };

      function loadTrackToDeck(item, deck) {
        initWebAudio();
        const titleEl = document.getElementById(`deck-${deck.toLowerCase()}-title`);
        const artistEl = document.getElementById(`deck-${deck.toLowerCase()}-artist`);
        const durEl = document.getElementById(`deck-${deck.toLowerCase()}-dur`);
        const audio = deck === "A" ? audioA : audioB;

        titleEl.textContent = item.title;
        artistEl.textContent = `${item.artist} (${item.platform})`;
        durEl.textContent = item.duration;
        audio.src = item.streamUrl || item.url;
        audio.load();
      }

      // Controles Deck A
      const btnPlayA = document.getElementById("btn-play-a");
      const btnCueA = document.getElementById("btn-cue-a");
      const platterA = document.getElementById("platter-a");
      const scrubberA = document.getElementById("scrubber-a");
      const pitchA = document.getElementById("pitch-a");
      const pitchAText = document.getElementById("pitch-a-text");
      const curTimeA = document.getElementById("deck-a-cur-time");
      const remTimeA = document.getElementById("deck-a-rem-time");

      btnPlayA.addEventListener("click", () => {
        initWebAudio();
        if (audioA.paused) {
          audioA.play().then(() => {
            btnPlayA.classList.add("active");
            platterA.classList.add("spinning");
          });
        } else {
          audioA.pause();
          btnPlayA.classList.remove("active");
          platterA.classList.remove("spinning");
        }
      });

      btnCueA.addEventListener("click", () => {
        audioA.pause();
        audioA.currentTime = 0;
        btnPlayA.classList.remove("active");
        platterA.classList.remove("spinning");
      });

      pitchA.addEventListener("input", () => {
        const p = parseFloat(pitchA.value);
        pitchAText.textContent = `${p > 0 ? "+" : ""}${p.toFixed(1)}%`;
        audioA.playbackRate = 1 + (p / 100);
      });

      audioA.addEventListener("timeupdate", () => {
        if (!audioA.duration) return;
        scrubberA.value = (audioA.currentTime / audioA.duration) * 100;
        const curM = Math.floor(audioA.currentTime / 60);
        const curS = Math.floor(audioA.currentTime % 60);
        curTimeA.textContent = `${String(curM).padStart(2, "0")}:${String(curS).padStart(2, "0")}`;

        const rem = audioA.duration - audioA.currentTime;
        const remM = Math.floor(rem / 60);
        const remS = Math.floor(rem % 60);
        remTimeA.textContent = `-${String(remM).padStart(2, "0")}:${String(remS).padStart(2, "0")}`;

        // Auto-DJ: Al faltar 12 segundos, hacer crossfade suave hacia Deck B
        if (isAutoDJ && rem <= 12 && rem > 11 && !audioB.paused) {
          triggerAutoCrossfade("B");
        }
      });

      scrubberA.addEventListener("input", () => {
        if (!audioA.duration) return;
        audioA.currentTime = (scrubberA.value / 100) * audioA.duration;
      });

      // Controles Deck B
      const btnPlayB = document.getElementById("btn-play-b");
      const btnCueB = document.getElementById("btn-cue-b");
      const platterB = document.getElementById("platter-b");
      const scrubberB = document.getElementById("scrubber-b");
      const pitchB = document.getElementById("pitch-b");
      const pitchBText = document.getElementById("pitch-b-text");
      const curTimeB = document.getElementById("deck-b-cur-time");
      const remTimeB = document.getElementById("deck-b-rem-time");

      btnPlayB.addEventListener("click", () => {
        initWebAudio();
        if (audioB.paused) {
          audioB.play().then(() => {
            btnPlayB.classList.add("active");
            platterB.classList.add("spinning");
          });
        } else {
          audioB.pause();
          btnPlayB.classList.remove("active");
          platterB.classList.remove("spinning");
        }
      });

      btnCueB.addEventListener("click", () => {
        audioB.pause();
        audioB.currentTime = 0;
        btnPlayB.classList.remove("active");
        platterB.classList.remove("spinning");
      });

      pitchB.addEventListener("input", () => {
        const p = parseFloat(pitchB.value);
        pitchBText.textContent = `${p > 0 ? "+" : ""}${p.toFixed(1)}%`;
        audioB.playbackRate = 1 + (p / 100);
      });

      audioB.addEventListener("timeupdate", () => {
        if (!audioB.duration) return;
        scrubberB.value = (audioB.currentTime / audioB.duration) * 100;
        const curM = Math.floor(audioB.currentTime / 60);
        const curS = Math.floor(audioB.currentTime % 60);
        curTimeB.textContent = `${String(curM).padStart(2, "0")}:${String(curS).padStart(2, "0")}`;

        const rem = audioB.duration - audioB.currentTime;
        const remM = Math.floor(rem / 60);
        const remS = Math.floor(rem % 60);
        remTimeB.textContent = `-${String(remM).padStart(2, "0")}:${String(remS).padStart(2, "0")}`;

        // Auto-DJ: Al faltar 12 segundos, hacer crossfade suave hacia Deck A
        if (isAutoDJ && rem <= 12 && rem > 11 && !audioA.paused) {
          triggerAutoCrossfade("A");
        }
      });

      scrubberB.addEventListener("input", () => {
        if (!audioB.duration) return;
        audioB.currentTime = (scrubberB.value / 100) * audioB.duration;
      });

      // Crossfader & Auto-DJ
      const crossfader = document.getElementById("crossfader");
      let isAutoDJ = true;

      function updateCrossfader(val) {
        const x = val / 100; // 0 = solo A, 1 = solo B, 0.5 = ambos
        // Curva de potencia constante
        const gainValA = Math.cos(x * 0.5 * Math.PI);
        const gainValB = Math.cos((1 - x) * 0.5 * Math.PI);

        if (gainA) gainA.gain.value = gainValA;
        if (gainB) gainB.gain.value = gainValB;

        // Fallback volumen directo si no hay audioContext aún
        if (!audioCtx) {
          audioA.volume = gainValA;
          audioB.volume = gainValB;
        }
      }

      crossfader.addEventListener("input", () => {
        initWebAudio();
        updateCrossfader(crossfader.value);
      });

      document.getElementById("btn-fade-left").addEventListener("click", () => triggerAutoCrossfade("A"));
      document.getElementById("btn-fade-center").addEventListener("click", () => {
        crossfader.value = 50;
        updateCrossfader(50);
      });
      document.getElementById("btn-fade-right").addEventListener("click", () => triggerAutoCrossfade("B"));

      function triggerAutoCrossfade(target) {
        initWebAudio();
        const startVal = parseFloat(crossfader.value);
        const endVal = target === "A" ? 0 : 100;
        const steps = 30;
        const intervalTime = 60; // Total ~1.8 segundos
        let step = 0;

        const timer = setInterval(() => {
          step++;
          const curVal = startVal + ((endVal - startVal) * (step / steps));
          crossfader.value = curVal;
          updateCrossfader(curVal);
          if (step >= steps) clearInterval(timer);
        }, intervalTime);
      }

      const btnAutoDJ = document.getElementById("btn-auto-dj");
      btnAutoDJ.addEventListener("click", () => {
        isAutoDJ = !isAutoDJ;
        btnAutoDJ.innerHTML = `<svg class="icon" viewBox="0 0 24 24" style="width: 14px; height: 14px;"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg> <span>Auto-DJ: ${isAutoDJ ? "ACTIVADO" : "DESACTIVADO"}</span>`;
        btnAutoDJ.style.background = isAutoDJ ? "rgba(0, 240, 255, 0.15)" : "rgba(255, 255, 255, 0.05)";
      });

      // Ecualizadores (EQ)
      const bindEQ = (id, filterNode) => {
        const el = document.getElementById(id);
        el.addEventListener("input", () => {
          initWebAudio();
          if (filterNode) filterNode.gain.value = parseFloat(el.value);
        });
      };

      bindEQ("eq-hi-a", eqHiA);
      bindEQ("eq-mid-a", eqMidA);
      bindEQ("eq-low-a", eqLowA);
      bindEQ("eq-hi-b", eqHiB);
      bindEQ("eq-mid-b", eqMidB);
      bindEQ("eq-low-b", eqLowB);

      // Scratching interactivo en tornamesas
      function setupScratch(turntableId, audioElem, platterElem) {
        const tt = document.getElementById(turntableId);
        let isScratching = false;
        let lastY = 0;

        tt.addEventListener("mousedown", (e) => {
          isScratching = true;
          lastY = e.clientY;
          platterElem.classList.remove("spinning");
        });

        window.addEventListener("mousemove", (e) => {
          if (!isScratching || !audioElem.duration) return;
          const deltaY = e.clientY - lastY;
          lastY = e.clientY;
          audioElem.currentTime = Math.max(0, Math.min(audioElem.duration, audioElem.currentTime - (deltaY * 0.06)));
        });

        window.addEventListener("mouseup", () => {
          if (isScratching) {
            isScratching = false;
            if (!audioElem.paused) platterElem.classList.add("spinning");
          }
        });
      }

      setupScratch("turntable-a", audioA, platterA);
      setupScratch("turntable-b", audioB, platterB);

      // Render inicial de la cola
      renderQueue();

      // Cargar primera pista en Deck A
      if (djQueue.length > 0) {
        document.getElementById("deck-a-title").textContent = djQueue[0].title;
        document.getElementById("deck-a-artist").textContent = `${djQueue[0].artist} (${djQueue[0].platform})`;
        document.getElementById("deck-a-dur").textContent = djQueue[0].duration;
      }
    });
  </script>
</body>
</html>
