<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="djBgGrad" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#261d18" />
      <stop offset="60%" stop-color="#14100d" />
      <stop offset="100%" stop-color="#090706" />
    </radialGradient>
    <linearGradient id="djBorderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.85" />
      <stop offset="50%" stop-color="#ff7a3d" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#ff007b" stop-opacity="0.7" />
    </linearGradient>
    <filter id="djGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="20" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="djShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <circle cx="180" cy="230" r="120" fill="#00f0ff" opacity="0.14" filter="url(#djGlow)" />
  <circle cx="332" cy="230" r="120" fill="#ff7a3d" opacity="0.14" filter="url(#djGlow)" />

  <rect x="36" y="36" width="440" height="440" rx="104" ry="104" fill="url(#djBgGrad)" stroke="url(#djBorderGrad)" stroke-width="4" filter="url(#djShadow)" />

  <!-- Dual Vinyl Turntables & Mixer Deck -->
  <g filter="url(#djShadow)">
    <!-- Turntable Deck Base -->
    <rect x="100" y="145" width="312" height="175" rx="20" ry="20" fill="#1b1513" stroke="#ff7a3d" stroke-width="3" />

    <!-- Left Vinyl Platter (Deck A - Cyan) -->
    <circle cx="175" cy="225" r="54" fill="#0d1114" stroke="#00f0ff" stroke-width="2.5" />
    <circle cx="175" cy="225" r="40" fill="none" stroke="#25323a" stroke-width="2" stroke-dasharray="4,4" />
    <circle cx="175" cy="225" r="16" fill="#00f0ff" />
    <circle cx="175" cy="225" r="4" fill="#14100d" />

    <!-- Right Vinyl Platter (Deck B - Orange) -->
    <circle cx="337" cy="225" r="54" fill="#16110f" stroke="#ff7a3d" stroke-width="2.5" />
    <circle cx="337" cy="225" r="40" fill="none" stroke="#3d2a23" stroke-width="2" stroke-dasharray="4,4" />
    <circle cx="337" cy="225" r="16" fill="#ff7a3d" />
    <circle cx="337" cy="225" r="4" fill="#14100d" />

    <!-- Central Mixer / EQ Columns -->
    <g fill="#f4ece1" opacity="0.8">
      <rect x="250" y="170" width="12" height="3" rx="1.5" />
      <rect x="250" y="180" width="12" height="3" rx="1.5" />
      <rect x="250" y="190" width="12" height="3" rx="1.5" />
    </g>

    <!-- Crossfader Slider -->
    <rect x="230" y="275" width="52" height="6" rx="3" fill="#2d231e" stroke="#f4ece1" stroke-width="1.5" />
    <rect x="250" y="268" width="12" height="20" rx="3" fill="#ff7a3d" />
  </g>

  <!-- Status Pill -->
  <g transform="translate(256, 395)" filter="url(#djShadow)">
    <rect x="-85" y="-18" width="170" height="36" rx="18" ry="18" fill="#1b1613" stroke="#00f0ff" stroke-width="1.8" />
    <circle cx="-60" cy="0" r="5" fill="#00f0ff">
      <animate attributeName="opacity" values="1;0.3;1" dur="1.8s" repeatCount="indefinite" />
    </circle>
    <text x="8" y="5" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5" fill="#f4ece1" text-anchor="middle">VORK DJ • LIVE</text>
  </g>
</svg>
