<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Guías de Aprendizaje e Integración - CloudTranslator | Ejemplos en JavaScript, Node.js, Python, PHP, cURL, Texto a Voz y Clonación de Voz por IA.">
  <meta property="og:title" content="Aprender e Integrar - CloudTranslator">
  <meta property="og:description" content="Aprende a integrar CloudTranslator en cualquier lenguaje de programación sin dependencias externas.">
  <title>Aprender e Integrar - CloudTranslator</title>
  <link rel="icon" type="image/png" sizes="192x192" href="/img/logo.png">
  <link rel="icon" type="image/png" sizes="64x64" href="/img/logo.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/img/logo.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/img/logo.png">
  <link rel="stylesheet" href="/css/style.css">
  <script>
    (function(){try{var m=document.cookie.match(/(?:^|; )cloud_translator_lang=([^;]*)/);var l=m?decodeURIComponent(m[1]):null;if(l&&l!=="original"&&l!=="es"){document.documentElement.classList.add("ct-pending");setTimeout(function(){document.documentElement.classList.remove("ct-pending");},800);}}catch(e){}})();
  </script>
  <script src="/js/spa-router.js" defer></script>
  <script src="/components/components.js" defer></script>
</head>
<body>

  <!-- Pie de Página Modular (Componente Centralizado) -->
  <footer id="footer-placeholder" data-component="footer" data-active="learn"></footer>

  <script src="/js/cloud-translator.js"></script>
  <script>
    window.copiarAlPortapapeles = function(btn, elementId) {
      const el = document.getElementById(elementId);
      if (!el) return;
      const text = el.innerText || el.textContent;
      navigator.clipboard.writeText(text).then(() => {
        const originalText = btn.textContent;
        btn.textContent = "COPIADO";
        btn.style.borderColor = "#ffffff";
        btn.style.color = "#ffffff";
        setTimeout(() => {
          btn.textContent = originalText;
          btn.style.borderColor = "";
          btn.style.color = "";
        }, 1500);
      }).catch(err => {
        console.error("Error al copiar:", err);
      });
    };

    document.addEventListener("DOMContentLoaded", () => {
      const apiEndpoint = "https://cloudtranslator.onrender.com/api/translate";
      window.translator = new CloudTranslator({ endpoint: apiEndpoint, useCookies: true, batchSize: 500 });
      document.getElementById("btn-english").onclick = () => window.translator.translateToEnglish();
      document.getElementById("btn-restore").onclick = () => window.translator.restoreOriginal();
      document.getElementById("select-lang").onchange = (e) => window.translator.translatePage(e.target.value);
      document.getElementById("btn-translate-custom").onclick = () => {
        const val = document.getElementById("input-custom-lang").value.trim().toLowerCase();
        if (val) window.translator.translatePage(val);
      };
    });
  </script>
</body>
</html>
