<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Referencia Técnica de API REST de CloudTranslator | Endpoints POST /api/translate, POST /api/tts, POST /api/voice-clone, esquemas JSON y especificación HTTP.">
  <meta property="og:title" content="Referencia Técnica de API REST - CloudTranslator">
  <meta property="og:description" content="Especificación completa de endpoints, esquemas JSON, parámetros de traducción, TTS y clonación de voz.">
  <title>Referencia Técnica de API REST - CloudTranslator</title>
  <link rel="icon" type="image/png" sizes="192x192" href="/img/logo.png">
  <link rel="icon" type="image/png" sizes="64x64" href="/img/logo.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/img/logo.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/img/logo.png">
  <link rel="stylesheet" href="/css/style.css">
  <script>
    (function(){try{var m=document.cookie.match(/(?:^|; )cloud_translator_lang=([^;]*)/);var l=m?decodeURIComponent(m[1]):null;if(l&&l!=="original"&&l!=="es"){document.documentElement.classList.add("ct-pending");setTimeout(function(){document.documentElement.classList.remove("ct-pending");},800);}}catch(e){}})();
  </script>
  <script src="/js/spa-router.js" defer></script>
  <script src="/components/components.js" defer></script>
</head>
<body>

  <!-- Pie de Página Modular (Componente Centralizado) -->
  <footer id="footer-placeholder" data-component="footer" data-active="api"></footer>

  <script src="/js/cloud-translator.js"></script>
  <script>
    // Función global para copiar al portapapeles con feedback visual monocromático
    function copiarAlPortapapeles(btn, elementId) {
      const el = document.getElementById(elementId);
      if (!el) return;
      const texto = el.innerText || el.textContent;
      navigator.clipboard.writeText(texto.trim()).then(() => {
        const originalText = btn.textContent;
        btn.textContent = "COPIADO";
        btn.style.background = "#ffffff";
        btn.style.color = "#000000";
        setTimeout(() => {
          btn.textContent = originalText;
          btn.style.background = "";
          btn.style.color = "";
        }, 1500);
      }).catch(err => {
        console.error("Error al copiar:", err);
      });
    }

    document.addEventListener("DOMContentLoaded", () => {
      // 1. ScrollSpy para el sidebar de la API
      const sessionLinks = document.querySelectorAll(".docs-sidebar-session");
      const subLinks = document.querySelectorAll(".docs-sidebar-sublink");
      const observedElements = document.querySelectorAll(".docs-section, .docs-subsection");

      const observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
          if (entry.isIntersecting) {
            const id = entry.target.getAttribute("id");

            if (entry.target.classList.contains("docs-subsection")) {
              subLinks.forEach(sub => {
                if (sub.getAttribute("data-target") === id || sub.getAttribute("href") === "#" + id) {
                  sub.classList.add("active");
                  const parentGroup = sub.closest(".docs-sidebar-group");
                  if (parentGroup) {
                    sessionLinks.forEach(s => s.classList.remove("active"));
                    parentGroup.querySelector(".docs-sidebar-session")?.classList.add("active");
                  }
                } else {
                  sub.classList.remove("active");
                }
              });
            } else if (entry.target.classList.contains("docs-section")) {
              sessionLinks.forEach(link => {
                if (link.getAttribute("data-target") === id || link.getAttribute("href") === "#" + id) {
                  link.classList.add("active");
                }
              });
            }
          }
        });
      }, {
        rootMargin: "-90px 0px -50% 0px",
        threshold: 0.1
      });

      observedElements.forEach(el => observer.observe(el));

      // Control de Índice Rápido Móvil / Tablet (TOC)
      const btnToggleToc = document.getElementById("btn-toggle-api-toc");
      const tocContent = document.getElementById("api-mobile-toc-content");
      if (btnToggleToc && tocContent) {
        btnToggleToc.addEventListener("click", () => {
          const isClosed = tocContent.style.display === "none";
          tocContent.style.display = isClosed ? "block" : "none";
        });
        tocContent.querySelectorAll("a").forEach(a => {
          a.addEventListener("click", () => {
            tocContent.style.display = "none";
          });
        });
      }

      // 2. Consola Interactiva de API en Vivo
      const btnRun = document.getElementById("btn-run-live-api");
      const textInput = document.getElementById("live-api-text");
      const langSelect = document.getElementById("live-api-lang");
      const outputEl = document.getElementById("live-api-output");

      btnRun.addEventListener("click", async () => {
        const textVal = textInput.value.trim();
        const langVal = langSelect.value;
        if (!textVal) return;

        outputEl.textContent = "Enviando solicitud a https://cloudtranslator.onrender.com/api/translate...";
        const t0 = performance.now();

        try {
          const resp = await fetch("https://cloudtranslator.onrender.com/api/translate", {
            method: "POST",
            headers: {
              "Content-Type": "application/json"
            },
            body: JSON.stringify({
              text: textVal,
              targetLanguage: langVal
            })
          });

          const latency = Math.round(performance.now() - t0);
          const data = await resp.json();

          const result = {
            httpStatus: resp.status + " " + resp.statusText,
            latencyMs: latency,
            responseBody: data
          };

          outputEl.textContent = JSON.stringify(result, null, 2);
        } catch (err) {
          outputEl.textContent = "Error al conectar con la API: " + err.message;
        }
      });

      // 3. Inicialización del SDK de traducción de página
      const apiEndpoint = "https://cloudtranslator.onrender.com/api/translate";
      window.translator = new CloudTranslator({ endpoint: apiEndpoint, useCookies: true, batchSize: 500 });
      document.getElementById("btn-english").onclick = () => window.translator.translateToEnglish();
      document.getElementById("btn-restore").onclick = () => window.translator.restoreOriginal();
      document.getElementById("select-lang").onchange = (e) => window.translator.translatePage(e.target.value);
      document.getElementById("btn-translate-custom").onclick = () => {
        const val = document.getElementById("input-custom-lang").value.trim().toLowerCase();
        if (val) window.translator.translatePage(val);
      };
    });
  </script>
</body>
</html>
