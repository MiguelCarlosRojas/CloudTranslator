<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Traductor en la Nube de CloudTranslator | Traducción por lotes de alta velocidad (+200 idiomas) con una sola petición HTTP consolidada, persistencia en cookies y 0ms desde memoria RAM.">
  <meta property="og:title" content="Traductor en la Nube - CloudTranslator">
  <meta property="og:description" content="Plataforma de traducción neuronal por lotes en la nube sin saturación de red ni bloqueos de interfaz.">
  <title>Traductor en la Nube - CloudTranslator</title>
  <link rel="icon" type="image/png" sizes="192x192" href="/img/logo.png">
  <link rel="icon" type="image/png" sizes="64x64" href="/img/logo.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/img/logo.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/img/logo.png">
  <link rel="stylesheet" href="/css/style.css">
  <script>
    (function(){try{var m=document.cookie.match(/(?:^|; )cloud_translator_lang=([^;]*)/);var l=m?decodeURIComponent(m[1]):null;if(l&&l!=="original"&&l!=="es"){document.documentElement.classList.add("ct-pending");setTimeout(function(){document.documentElement.classList.remove("ct-pending");},800);}}catch(e){}})();
  </script>
  <script src="/js/spa-router.js" defer></script>
  <script src="/components/components.js" defer></script>
</head>
<body>

  <!-- Pie de Página Modular (Componente Centralizado) -->
  <footer id="footer-placeholder" data-component="footer" data-active="translator"></footer>

  <script src="/js/cloud-translator.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const apiEndpoint = "https://cloudtranslator.onrender.com/api/translate";
      window.translator = new CloudTranslator({ endpoint: apiEndpoint, useCookies: true, batchSize: 500 });
      document.getElementById("btn-english").onclick = () => window.translator.translateToEnglish();
      document.getElementById("btn-restore").onclick = () => window.translator.restoreOriginal();
      document.getElementById("select-lang").onchange = (e) => window.translator.translatePage(e.target.value);
      document.getElementById("btn-translate-custom").onclick = () => {
        const val = document.getElementById("input-custom-lang").value.trim().toLowerCase();
        if (val) window.translator.translatePage(val);
      };

      // Consola Interactiva
      const btnRun = document.getElementById("btn-run-translator");
      const btnRunText = document.getElementById("btn-run-translator-text");
      const inputText = document.getElementById("translator-input-text");
      const targetLang = document.getElementById("translator-target-lang");
      const outputText = document.getElementById("translator-output-text");
      const outputJson = document.getElementById("translator-output-json");
      const latencyBadge = document.getElementById("translator-latency-badge");
      const stats = document.getElementById("translator-stats");
      const btnCopy = document.getElementById("btn-copy-result");
      const charCount = document.getElementById("translator-char-count");

      // Contador de caracteres en tiempo real
      if (inputText && charCount) {
        const updateCharCount = () => {
          const len = (inputText.value || "").length;
          charCount.textContent = `${len} caracteres`;
        };
        inputText.addEventListener("input", updateCharCount);
        updateCharCount();
      }

      // Bloqueo y control estricto de UI durante la traducción
      function setTranslatorLock(isTranslating) {
        if (inputText) {
          inputText.readOnly = isTranslating;
          inputText.style.cursor = isTranslating ? "not-allowed" : "text";
          inputText.style.opacity = isTranslating ? "0.6" : "1";
        }
        if (targetLang) {
          targetLang.disabled = isTranslating;
          targetLang.style.cursor = isTranslating ? "not-allowed" : "pointer";
          targetLang.style.opacity = isTranslating ? "0.6" : "1";
          if (targetLang.parentElement) {
            targetLang.parentElement.style.pointerEvents = isTranslating ? "none" : "auto";
          }
        }
        if (btnRun) {
          btnRun.disabled = isTranslating;
          btnRun.style.cursor = isTranslating ? "not-allowed" : "pointer";
          btnRun.style.opacity = isTranslating ? "0.75" : "1";
          if (btnRunText) {
            if (isTranslating) {
              btnRunText.innerHTML = '<span class="spinner" style="display:inline-block; width:13px; height:13px; border:2px solid #fff; border-top-color:transparent; border-radius:50%; animation:spin 0.8s linear infinite; margin-right:8px; vertical-align:middle;"></span>Traduciendo...';
            } else {
              btnRunText.textContent = "TRADUCIR TEXTO";
            }
          }
        }
      }

      // Caché en memoria del cliente para respuestas instantáneas en 0ms
      const translatorClientCache = new Map();

      if (btnRun) {
        btnRun.addEventListener("click", async () => {
          const text = (inputText.value || "").trim();
          const to = targetLang.value;
          if (!text) {
            inputText.focus();
            return;
          }

          const cacheKey = `${to}:${text}`;
          if (translatorClientCache.has(cacheKey)) {
            const cached = translatorClientCache.get(cacheKey);
            latencyBadge.textContent = "LATENCIA: 0ms (CACHÉ LOCAL)";
            latencyBadge.style.display = "inline-block";
            outputJson.textContent = JSON.stringify(cached, null, 2);
            outputText.textContent = cached.translatedText || text;
            stats.textContent = `Éxito • ${(cached.translatedText || text).length} caracteres • 0ms (Caché local)`;
            stats.style.color = "#10b981";
            return;
          }

          setTranslatorLock(true);
          outputText.textContent = "Traduciendo a través del microservicio de alto rendimiento...";
          stats.textContent = "Conectando al microservicio...";
          stats.style.color = "var(--primary)";
          const t0 = performance.now();

          try {
            const resp = await fetch("/api/translate", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ text, to })
            });

            const latency = Math.round(performance.now() - t0);
            const data = await resp.json();

            latencyBadge.textContent = "LATENCIA: " + latency + "ms";
            latencyBadge.style.display = "inline-block";
            outputJson.textContent = JSON.stringify(data, null, 2);

            if (data.translatedText) {
              translatorClientCache.set(cacheKey, data);
              outputText.textContent = data.translatedText;
              stats.textContent = `Éxito • ${data.translatedText.length} caracteres • ${latency}ms`;
              stats.style.color = "#10b981";
            } else {
              outputText.textContent = "Error al recibir respuesta: " + (data.error || "Formato inválido");
              stats.textContent = "Error en respuesta";
              stats.style.color = "#ef4444";
            }
          } catch (err) {
            outputText.textContent = "Error de conexión: " + err.message;
            outputJson.textContent = JSON.stringify({ error: err.message }, null, 2);
            stats.textContent = "Fallo de red";
            stats.style.color = "#ef4444";
          } finally {
            setTranslatorLock(false);
          }
        });
      }

      if (btnCopy) {
        btnCopy.addEventListener("click", () => {
          const txt = outputText.textContent;
          if (txt && !txt.startsWith("Haz clic") && !txt.startsWith("Error") && !txt.startsWith("Traduciendo")) {
            navigator.clipboard.writeText(txt);
            btnCopy.innerHTML = '<svg class="icon" viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg> <span>¡Copiado!</span>';
            setTimeout(() => {
              btnCopy.innerHTML = '<svg class="icon" viewBox="0 0 24 24"><rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg> <span>Copiar Resultado</span>';
            }, 1800);
          }
        });
      }
    });
  </script>
</body>
</html>
