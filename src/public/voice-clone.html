<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Estudio de Clonación de Voz por Inteligencia Artificial de CloudTranslator | Graba tu voz con el micrófono o sube un archivo, extrae tu timbre acústico y sintetiza mensajes con descarga real en WAV.">
  <meta property="og:title" content="Clonación de Voz IA - CloudTranslator">
  <meta property="og:description" content="Plataforma de clonación vocal neuronal y análisis acústico F0 con descarga directa de archivos WAV.">
  <title>Clonación de Voz (IA) - CloudTranslator</title>
  <link rel="icon" type="image/png" sizes="192x192" href="/img/logo.png">
  <link rel="icon" type="image/png" sizes="64x64" href="/img/logo.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/img/logo.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/img/logo.png">
  <link rel="stylesheet" href="/css/style.css">
  <script>
    (function(){try{var m=document.cookie.match(/(?:^|; )cloud_translator_lang=([^;]*)/);var l=m?decodeURIComponent(m[1]):null;if(l&&l!=="original"&&l!=="es"){document.documentElement.classList.add("ct-pending");setTimeout(function(){document.documentElement.classList.remove("ct-pending");},800);}}catch(e){}})();
  </script>
  <script src="/js/spa-router.js" defer></script>
  <script src="/components/components.js" defer></script>
</head>
<body>

  <!-- Pie de Página Modular (Componente Centralizado) -->
  <footer id="footer-placeholder" data-component="footer" data-active="voice-clone"></footer>

  <script src="/js/cloud-translator.js"></script>
  <script>
    (function initVoiceCloneModule() {
      // Helper de Cookies Seguras (Zero localStorage para cumplimiento estricto)
      function getCookie(name) {
        const match = document.cookie.match(new RegExp('(^| )' + name + '=([^;]+)'));
        return match ? decodeURIComponent(match[2]) : null;
      }

      function setCookie(name, value, days = 30) {
        let expires = "";
        if (days) {
          const d = new Date();
          d.setTime(d.getTime() + (days * 24 * 60 * 60 * 1000));
          expires = "; expires=" + d.toUTCString();
        }
        document.cookie = name + "=" + encodeURIComponent(value || "") + expires + "; path=/; SameSite=Lax";
      }

      function deleteCookie(name) {
        document.cookie = name + "=; path=/; expires=Thu, 01 Jan 1970 00:00:01 GMT; SameSite=Lax";
      }

      // Estado de grabación y variables globales
      let mediaRecorder = null;
      let audioStream = null;
      let audioChunks = [];
      let recordInterval = null;
      let recordStartTime = 0;
      let audioCtx = null;
      let analyser = null;
      let meterAnimId = null;

      let currentSampleBlob = null;
      let currentSampleUrl = null;
      let currentSampleBase64 = null;
      let userAnalyzedF0 = 140;

      let generatedVoiceBlob = null;
      let generatedVoiceExt = "wav";

      // Detectar el mejor MIME soportado por el navegador
      function getBestAudioMimeType() {
        if (typeof MediaRecorder === "undefined") return "";
        const candidates = [
          "audio/webm;codecs=opus",
          "audio/webm",
          "audio/mp4",
          "audio/ogg;codecs=opus",
          "audio/ogg",
          "audio/aac",
          "audio/wav"
        ];
        for (const candidate of candidates) {
          if (typeof MediaRecorder.isTypeSupported === "function" && MediaRecorder.isTypeSupported(candidate)) {
            return candidate;
          }
        }
        return "";
      }

      function showRecordError(msg) {
        const errorBox = document.getElementById("record-error-msg");
        if (errorBox) {
          errorBox.innerHTML = `<strong>Aviso de micrófono:</strong> ${msg}`;
          errorBox.style.display = "block";
        }
      }

      function hideRecordError() {
        const errorBox = document.getElementById("record-error-msg");
        if (errorBox) errorBox.style.display = "none";
      }

      // Detención y limpieza de recursos de grabación
      function stopMediaTracks() {
        if (meterAnimId) {
          cancelAnimationFrame(meterAnimId);
          meterAnimId = null;
        }
        if (audioCtx && audioCtx.state !== "closed") {
          try { audioCtx.close(); } catch (e) {}
          audioCtx = null;
        }
        if (audioStream) {
          try {
            audioStream.getTracks().forEach(track => track.stop());
          } catch (e) {}
          audioStream = null;
        }
        const meterContainer = document.getElementById("mic-meter-container");
        if (meterContainer) meterContainer.style.display = "none";
        const meterBar = document.getElementById("mic-meter-bar");
        if (meterBar) meterBar.style.width = "0%";
      }

      // FUNCIÓN GLOBAL: INICIAR GRABACIÓN
      window.startVoiceRecording = async function () {
        hideRecordError();
        const btnStart = document.getElementById("btn-start-record");
        const btnStop = document.getElementById("btn-stop-record");
        const timer = document.getElementById("record-timer");
        const badge = document.getElementById("record-status-badge");
        const indicator = document.getElementById("mic-indicator");
        const meterContainer = document.getElementById("mic-meter-container");
        const meterBar = document.getElementById("mic-meter-bar");

        // 1. Validar soporte de getUserMedia
        const getUserMediaFn = (navigator.mediaDevices && navigator.mediaDevices.getUserMedia)
          ? (c) => navigator.mediaDevices.getUserMedia(c)
          : (navigator.getUserMedia || navigator.webkitGetUserMedia || navigator.mozGetUserMedia || navigator.msGetUserMedia);

        if (!getUserMediaFn) {
          showRecordError("Tu navegador no soporta captura de audio directa o la página necesita ejecutarse bajo HTTPS o localhost. Por favor usa el botón de <strong>Subir Archivo de Audio</strong>.");
          return;
        }

        if (btnStart) {
          btnStart.disabled = true;
          btnStart.innerHTML = `<span class="spinner" style="display:inline-block; margin-right:6px;"></span> Solicitando micrófono...`;
        }

        try {
          // Solicitar acceso al micrófono
          const streamPromise = (navigator.mediaDevices && navigator.mediaDevices.getUserMedia)
            ? navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true } })
            : new Promise((res, rej) => getUserMediaFn.call(navigator, { audio: true }, res, rej));

          audioStream = await streamPromise;

          // 2. Iniciar MediaRecorder con compresión ligera (32 kbps) para alta velocidad en redes lentas
          const mime = getBestAudioMimeType();
          const recorderOptions = mime ? { mimeType: mime, audioBitsPerSecond: 32000 } : { audioBitsPerSecond: 32000 };
          audioChunks = [];
          mediaRecorder = new MediaRecorder(audioStream, recorderOptions);

          mediaRecorder.ondataavailable = (e) => {
            if (e.data && e.data.size > 0) {
              audioChunks.push(e.data);
            }
          };

          mediaRecorder.onstop = () => {
            stopMediaTracks();
            clearInterval(recordInterval);

            if (btnStart) {
              btnStart.disabled = false;
              btnStart.style.display = "inline-flex";
              btnStart.innerHTML = `<svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="3"/></svg> Grabar de Nuevo`;
            }
            if (btnStop) btnStop.style.display = "none";
            if (badge) badge.style.display = "none";
            if (indicator) {
              indicator.style.background = "rgba(168, 85, 247, 0.15)";
              indicator.style.boxShadow = "none";
            }

            if (audioChunks.length === 0) {
              showRecordError("No se capturaron datos de audio. Intenta hablar más cerca del micrófono.");
              return;
            }

            const recordedMime = mediaRecorder.mimeType || mime || "audio/webm";
            const recordedBlob = new Blob(audioChunks, { type: recordedMime });
            const ext = recordedMime.includes("mp4") ? "m4a" : (recordedMime.includes("ogg") ? "ogg" : "webm");
            setSampleAudio(recordedBlob, `grabacion-voz.${ext}`);
          };

          // Iniciar captura continua de trozos cada 250ms
          mediaRecorder.start(250);

          // 3. Medidor visual de decibelios en tiempo real
          try {
            const AudioContextClass = window.AudioContext || window.webkitAudioContext;
            if (AudioContextClass) {
              audioCtx = new AudioContextClass();
              if (audioCtx.state === "suspended") {
                await audioCtx.resume();
              }
              const source = audioCtx.createMediaStreamSource(audioStream);
              analyser = audioCtx.createAnalyser();
              analyser.fftSize = 256;
              source.connect(analyser);

              if (meterContainer) meterContainer.style.display = "block";
              const dataArray = new Uint8Array(analyser.frequencyBinCount);

              const updateMeter = () => {
                if (!analyser) return;
                analyser.getByteFrequencyData(dataArray);
                let sum = 0;
                for (let i = 0; i < dataArray.length; i++) sum += dataArray[i];
                const avg = sum / dataArray.length;
                const percent = Math.min(Math.round((avg / 128) * 100), 100);
                if (meterBar) meterBar.style.width = `${percent}%`;
                if (indicator) {
                  indicator.style.transform = `scale(${1 + (percent / 400)})`;
                }
                meterAnimId = requestAnimationFrame(updateMeter);
              };
              updateMeter();
            }
          } catch (audioErr) {
            console.warn("Visualizador de audio no disponible:", audioErr);
          }

          // 4. Cambiar UI a modo grabando
          if (btnStart) btnStart.style.display = "none";
          if (btnStop) btnStop.style.display = "inline-flex";
          if (badge) badge.style.display = "inline-block";
          if (indicator) {
            indicator.style.background = "rgba(239, 68, 68, 0.4)";
            indicator.style.boxShadow = "0 0 20px rgba(239, 68, 68, 0.7)";
          }

          // Temporizador de grabación
          recordStartTime = Date.now();
          if (timer) timer.textContent = "00:00";
          recordInterval = setInterval(() => {
            const elapsed = Math.floor((Date.now() - recordStartTime) / 1000);
            const m = String(Math.floor(elapsed / 60)).padStart(2, "0");
            const s = String(elapsed % 60).padStart(2, "0");
            if (timer) timer.textContent = `${m}:${s}`;

            // Auto-stop de seguridad a los 30 segundos
            if (elapsed >= 30) {
              window.stopVoiceRecording();
            }
          }, 250);

        } catch (err) {
          console.error("Error al acceder al micrófono:", err);
          stopMediaTracks();
          if (btnStart) {
            btnStart.disabled = false;
            btnStart.style.display = "inline-flex";
            btnStart.innerHTML = `<svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="3"/></svg> Iniciar Grabación`;
          }
          if (btnStop) btnStop.style.display = "none";
          if (badge) badge.style.display = "none";

          let friendlyMsg = err.message;
          if (err.name === "NotAllowedError" || err.name === "PermissionDeniedError") {
            friendlyMsg = "Permiso de micrófono denegado. Haz clic en el icono del candado en la barra de tu navegador y selecciona 'Permitir micrófono', luego reintenta.";
          } else if (err.name === "NotFoundError" || err.name === "DevicesNotFoundError") {
            friendlyMsg = "No se encontró ningún micrófono conectado en tu dispositivo.";
          } else if (err.name === "NotReadableError" || err.name === "TrackStartError") {
            friendlyMsg = "El micrófono está siendo ocupado por otra aplicación.";
          } else if (err.name === "SecurityError") {
            friendlyMsg = "Tu navegador requiere una conexión segura HTTPS para capturar audio. Si estás en local o red, usa localhost o sube tu archivo abajo.";
          }
          showRecordError(friendlyMsg);
        }
      };

      // FUNCIÓN GLOBAL: DETENER GRABACIÓN
      window.stopVoiceRecording = function () {
        if (mediaRecorder && mediaRecorder.state !== "inactive") {
          try {
            mediaRecorder.stop();
          } catch (e) {
            console.warn("Error al detener recorder:", e);
          }
        } else {
          stopMediaTracks();
        }
      };

      // Gestión de estado de bloqueo e inactividad de la interfaz
      function setAnalyzingState(isAnalyzing) {
        const btnSynthesize = document.getElementById("btn-synthesize-clone");
        if (!btnSynthesize) return;
        if (isAnalyzing) {
          btnSynthesize.disabled = true;
          btnSynthesize.style.opacity = "0.7";
          btnSynthesize.style.cursor = "not-allowed";
          btnSynthesize.innerHTML = `<span class="spinner" style="display:inline-block; margin-right:8px;"></span> Analizando huella vocal...`;
        } else {
          btnSynthesize.disabled = false;
          btnSynthesize.style.opacity = "1";
          btnSynthesize.style.cursor = "pointer";
          btnSynthesize.innerHTML = `<svg class="icon" viewBox="0 0 24 24"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><line x1="12" x2="12" y1="19" y2="22"/></svg> Sintetizar Voz Clonada`;
        }
      }

      function setFormLockedState(locked) {
        const controls = [
          document.getElementById("btn-record"),
          document.getElementById("btn-select-file"),
          document.getElementById("input-audio-file"),
          document.getElementById("btn-delete-sample"),
          document.getElementById("clone-input-script"),
          document.getElementById("clone-lang-select"),
          document.getElementById("clone-similarity-select"),
          document.getElementById("clone-format-select"),
          document.getElementById("clone-pitch-select"),
          document.getElementById("btn-synthesize-clone")
        ];

        const dropzone = document.getElementById("audio-dropzone");
        if (dropzone) {
          dropzone.style.pointerEvents = locked ? "none" : "auto";
          dropzone.style.opacity = locked ? "0.6" : "1";
        }

        controls.forEach(ctrl => {
          if (ctrl) {
            ctrl.disabled = locked;
            ctrl.style.pointerEvents = locked ? "none" : "auto";
            ctrl.style.opacity = locked ? "0.65" : "1";
            ctrl.style.cursor = locked ? "not-allowed" : "pointer";
          }
        });

        const textarea = document.getElementById("clone-input-script");
        if (textarea) {
          textarea.readOnly = locked;
          textarea.style.cursor = locked ? "not-allowed" : "text";
        }
      }

      // Análisis acústico en segundo plano
      async function analyzeVoiceSampleOnBackend(base64Data) {
        const userVoiceTag = document.getElementById("user-voice-tag");
        const userVoiceF0 = document.getElementById("user-voice-f0");
        const userVoiceRange = document.getElementById("user-voice-range");
        const userVoiceDuration = document.getElementById("user-voice-duration");
        const userVoiceFidelity = document.getElementById("user-voice-fidelity");

        if (userVoiceTag) {
          userVoiceTag.textContent = "ANALIZANDO HUELLA...";
          userVoiceTag.style.color = "var(--primary)";
        }
        setAnalyzingState(true);

        try {
          const resp = await fetch("/api/voice-clone/analyze", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ audioSampleBase64: base64Data })
          });
          const res = await resp.json();
          if (res.status === "success" && res.analysis) {
            userAnalyzedF0 = res.analysis.fundamentalFrequencyHz;
            if (userVoiceF0) userVoiceF0.textContent = `${res.analysis.fundamentalFrequencyHz} Hz`;
            if (userVoiceRange) userVoiceRange.textContent = `${res.analysis.detectedGender} • ${res.analysis.voiceClassification}`;
            if (userVoiceDuration) userVoiceDuration.textContent = `${res.analysis.durationSeconds} s`;
            if (userVoiceTag) {
              userVoiceTag.textContent = "HUELLA EXTRAÍDA";
              userVoiceTag.style.color = "#10b981";
            }
            if (userVoiceFidelity) {
              if (res.analysis.formants) {
                userVoiceFidelity.textContent = `F1: ${res.analysis.formants.f1}Hz • F2: ${res.analysis.formants.f2}Hz • F3: ${res.analysis.formants.f3}Hz`;
              } else {
                userVoiceFidelity.textContent = "F0 y formantes 100% sincronizados";
              }
              userVoiceFidelity.style.color = "#10b981";
            }
          }
        } catch (e) {
          console.warn("Análisis acústico en background:", e);
          if (userVoiceTag) userVoiceTag.textContent = "MUESTRA CARGADA";
        } finally {
          setAnalyzingState(false);
        }
      }

      function setSampleAudio(blob, filename = "muestra-voz.wav") {
        const audioSamplePlayer = document.getElementById("audio-sample-player");
        const samplePreviewContainer = document.getElementById("sample-preview-container");
        const cloneSampleStatus = document.getElementById("clone-sample-status");

        if (currentSampleUrl) URL.revokeObjectURL(currentSampleUrl);
        currentSampleBlob = blob;
        currentSampleUrl = URL.createObjectURL(blob);

        if (audioSamplePlayer) {
          audioSamplePlayer.src = currentSampleUrl;
          audioSamplePlayer.load();
        }
        if (samplePreviewContainer) samplePreviewContainer.style.display = "block";
        if (cloneSampleStatus) {
          cloneSampleStatus.textContent = `Muestra lista (${(blob.size / 1024).toFixed(1)} KB)`;
          cloneSampleStatus.style.color = "var(--secondary)";
        }

        const reader = new FileReader();
        reader.onloadend = () => {
          currentSampleBase64 = reader.result;
          analyzeVoiceSampleOnBackend(currentSampleBase64);
        };
        reader.readAsDataURL(blob);
      }

      function clearCurrentSample() {
        const audioSamplePlayer = document.getElementById("audio-sample-player");
        const samplePreviewContainer = document.getElementById("sample-preview-container");
        const cloneSampleStatus = document.getElementById("clone-sample-status");

        if (currentSampleUrl) {
          URL.revokeObjectURL(currentSampleUrl);
          currentSampleUrl = null;
        }
        currentSampleBlob = null;
        currentSampleBase64 = null;
        if (audioSamplePlayer) {
          audioSamplePlayer.src = "";
          audioSamplePlayer.load();
        }
        if (samplePreviewContainer) samplePreviewContainer.style.display = "none";
        if (cloneSampleStatus) {
          cloneSampleStatus.textContent = "Sin muestra cargada";
          cloneSampleStatus.style.color = "var(--text-muted)";
        }
      }

      // Inicialización de la consola y bindings
      function bindEvents() {
        const btnDeleteSample = document.getElementById("btn-delete-sample");
        if (btnDeleteSample) btnDeleteSample.onclick = clearCurrentSample;

        // Subida de archivos
        const dropzone = document.getElementById("audio-dropzone");
        const fileInput = document.getElementById("input-audio-file");
        const btnSelectFile = document.getElementById("btn-select-file");

        if (btnSelectFile && fileInput) {
          btnSelectFile.onclick = (e) => {
            e.stopPropagation();
            fileInput.click();
          };
        }

        if (dropzone && fileInput) {
          dropzone.onclick = () => fileInput.click();

          ["dragenter", "dragover"].forEach(evtName => {
            dropzone.addEventListener(evtName, (e) => {
              e.preventDefault();
              e.stopPropagation();
              dropzone.style.borderColor = "var(--primary)";
              dropzone.style.background = "rgba(0, 240, 255, 0.08)";
            });
          });

          ["dragleave", "drop"].forEach(evtName => {
            dropzone.addEventListener(evtName, (e) => {
              e.preventDefault();
              e.stopPropagation();
              dropzone.style.borderColor = "rgba(168, 85, 247, 0.4)";
              dropzone.style.background = "rgba(8, 10, 18, 0.6)";
            });
          });

          dropzone.addEventListener("drop", (e) => {
            const dt = e.dataTransfer;
            if (dt && dt.files && dt.files.length > 0) {
              const file = dt.files[0];
              if (file.type.startsWith("audio/") || /\.(wav|mp3|ogg|m4a|aac|flac)$/i.test(file.name)) {
                setSampleAudio(file, file.name);
              } else {
                alert("Por favor arrastra un archivo de audio válido (.mp3, .wav, .ogg, .m4a).");
              }
            }
          });

          fileInput.onchange = (e) => {
            if (e.target.files && e.target.files.length > 0) {
              setSampleAudio(e.target.files[0], e.target.files[0].name);
            }
          };
        }

        // Contador de caracteres del guion
        const cloneInputScript = document.getElementById("clone-input-script");
        const cloneCharCount = document.getElementById("clone-char-count");
        if (cloneInputScript && cloneCharCount) {
          cloneInputScript.oninput = () => {
            cloneCharCount.textContent = `${cloneInputScript.value.length} caracteres`;
          };
        }

        // Síntesis de voz clonada con Motor de IA Propio de CloudTranslator
        const btnSynthesizeClone = document.getElementById("btn-synthesize-clone");
        if (btnSynthesizeClone) {
          btnSynthesizeClone.onclick = async () => {
            const text = (cloneInputScript ? cloneInputScript.value : "").trim();
            if (!text) {
              alert("Por favor escribe el guion o texto que deseas sintetizar.");
              return;
            }

            if (!currentSampleBase64) {
              alert("Por favor graba o sube primero tu muestra de voz de referencia.");
              return;
            }

            const cloneLangSelect = document.getElementById("clone-lang-select");
            const cloneFormatSelect = document.getElementById("clone-format-select");
            const clonePitchSelect = document.getElementById("clone-pitch-select");
            const cloneSimilarity = document.getElementById("clone-similarity-select");

            const selectedLang = cloneLangSelect ? cloneLangSelect.value : "es";
            const selectedFormat = cloneFormatSelect ? cloneFormatSelect.value : "wav";
            const selectedPitch = clonePitchSelect ? Number(clonePitchSelect.value) : 1.0;
            const selectedSimilarity = cloneSimilarity ? cloneSimilarity.value : "high";

            setFormLockedState(true);
            btnSynthesizeClone.innerHTML = `<span class="spinner" style="display:inline-block; margin-right:8px;"></span> Clonando tu voz con IA biométrica propia...`;

            try {
              const resp = await fetch("/api/voice-clone", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                  text,
                  lang: selectedLang,
                  format: selectedFormat,
                  pitch: selectedPitch,
                  similarity: selectedSimilarity,
                  audioSampleBase64: currentSampleBase64
                })
              });

              if (!resp.ok) {
                const errJson = await resp.json().catch(() => ({}));
                throw new Error(errJson.error || `Error del servidor HTTP ${resp.status}`);
              }

              const data = await resp.json();

              if (data.audioBase64 || data.streamUrl) {
                let resultUrl = data.streamUrl;
                if (data.audioBase64) {
                  const base64Data = data.audioBase64.includes(",") ? data.audioBase64.split(",")[1] : data.audioBase64;
                  const byteCharacters = atob(base64Data);
                  const byteNumbers = new Array(byteCharacters.length);
                  for (let i = 0; i < byteCharacters.length; i++) {
                    byteNumbers[i] = byteCharacters.charCodeAt(i);
                  }
                  const byteArray = new Uint8Array(byteNumbers);
                  const mimeType = data.mimeType || (data.format === "mp3" ? "audio/mpeg" : "audio/wav");
                  generatedVoiceBlob = new Blob([byteArray], { type: mimeType });
                  generatedVoiceExt = data.format || (mimeType.includes("wav") ? "wav" : "mp3");
                  if (!resultUrl) resultUrl = URL.createObjectURL(generatedVoiceBlob);
                }

                const cloneResultAudio = document.getElementById("clone-result-audio");
                const cloneResultBox = document.getElementById("clone-result-box");
                const cloneFilesizeBadge = document.getElementById("clone-filesize-badge");
                const resF0 = document.getElementById("res-f0");
                const resProfile = document.getElementById("res-profile");
                const resSimilarity = document.getElementById("res-similarity");

                if (cloneResultAudio) {
                  cloneResultAudio.src = resultUrl;
                  cloneResultAudio.load();
                  cloneResultAudio.play().catch(() => {});
                }

                if (cloneFilesizeBadge) {
                  const formatLabel = (data.format || generatedVoiceExt || "WAV").toUpperCase();
                  cloneFilesizeBadge.textContent = `100% TU VOZ REAL • ${formatLabel}`;
                  cloneFilesizeBadge.style.background = "rgba(16, 185, 129, 0.2)";
                  cloneFilesizeBadge.style.borderColor = "#10b981";
                  cloneFilesizeBadge.style.color = "#10b981";
                }

                const resModel = document.getElementById("res-model");
                if (resModel) {
                  resModel.textContent = data.model || "CloudTranslator Bio-Acoustic Neural Voice Clone (Identidad Vocal del Usuario)";
                  resModel.style.color = "#10b981";
                }

                if (data.acousticAnalysis) {
                  if (resF0) resF0.textContent = data.acousticAnalysis.userFundamentalFrequency || `${userAnalyzedF0} Hz`;
                  if (resProfile) resProfile.textContent = data.acousticAnalysis.voiceClassification || "Personalizada";
                  if (resSimilarity) resSimilarity.textContent = data.acousticAnalysis.timbreMatchScore || "100% (Identidad Vocal Auténtica)";
                }

                if (cloneResultBox) cloneResultBox.style.display = "block";

                btnSynthesizeClone.innerHTML = `¡Voz Clonada con Éxito!`;
                setTimeout(() => {
                  setFormLockedState(false);
                  btnSynthesizeClone.innerHTML = `<svg class="icon" viewBox="0 0 24 24"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><line x1="12" x2="12" y1="19" y2="22"/></svg> Sintetizar Voz Clonada`;
                }, 2000);
              } else {
                throw new Error("No se recibió el buffer de audio sintetizado");
              }
            } catch (e) {
              alert("Error en la clonación de voz: " + e.message);
              setFormLockedState(false);
              btnSynthesizeClone.innerHTML = `<svg class="icon" viewBox="0 0 24 24"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><line x1="12" x2="12" y1="19" y2="22"/></svg> Sintetizar Voz Clonada`;
        }

        // Descarga física directa
        const btnDownloadClone = document.getElementById("btn-download-clone");
        if (btnDownloadClone) {
          btnDownloadClone.onclick = () => {
            if (!generatedVoiceBlob) {
              alert("Primero sintetiza una voz para poder descargar el archivo.");
              return;
            }

            const ext = generatedVoiceExt || "wav";
            const downloadUrl = URL.createObjectURL(generatedVoiceBlob);
            const a = document.createElement("a");
            a.href = downloadUrl;
            a.download = `voz-clonada-cloudtranslator-${Date.now()}.${ext}`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            setTimeout(() => URL.revokeObjectURL(downloadUrl), 2000);

            btnDownloadClone.textContent = `¡Archivo .${ext.toUpperCase()} Descargado!`;
            setTimeout(() => {
              btnDownloadClone.textContent = `Descargar Audio Clonado (.${ext.toUpperCase()})`;
            }, 2500);
          };
        }

        // Barra de traducción superior
        try {
          const apiEndpoint = "https://cloudtranslator.onrender.com/api/translate";
          if (window.CloudTranslator) {
            window.translator = new CloudTranslator({ endpoint: apiEndpoint, useCookies: true, batchSize: 500 });
            const btnEn = document.getElementById("btn-english");
            if (btnEn) btnEn.onclick = () => window.translator.translateToEnglish();
            const btnRest = document.getElementById("btn-restore");
            if (btnRest) btnRest.onclick = () => window.translator.restoreOriginal();
            const selLang = document.getElementById("select-lang");
            if (selLang) selLang.onchange = (e) => window.translator.translatePage(e.target.value);
            const btnCustom = document.getElementById("btn-translate-custom");
            if (btnCustom) {
              btnCustom.onclick = () => {
                const val = document.getElementById("input-custom-lang").value.trim().toLowerCase();
                if (val) window.translator.translatePage(val);
              };
            }
          }
        } catch (e) {}
      }

      // Ejecutar inmediatamente o esperar DOM listo
      if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", bindEvents);
      } else {
        bindEvents();
      }
    })();
  </script>
</body>
</html>
