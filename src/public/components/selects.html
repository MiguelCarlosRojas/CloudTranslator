<!-- Catálogo de Componentes UI Reutilizables: Selectores y Dropdowns Vork -->

<!-- 1. Tamaños Disponibles: Pequeño, Mediano (Estándar), Grande -->

<!-- Selector Pequeño (select-sm) -->
<div class="select-wrapper select-w-sm">
  <select class="form-select-custom select-sm" aria-label="Selector Pequeño">
    <option value="sm">Pequeño (select-sm)</option>
    <option value="es">Español (es)</option>
    <option value="en">English (en)</option>
  </select>
</div>

<!-- Selector Mediano Estándar (select-md) -->
<div class="select-wrapper select-w-md">
  <select class="form-select-custom select-md" aria-label="Selector Mediano">
    <option value="md">Mediano (select-md - Estándar)</option>
    <option value="es">Español (es)</option>
    <option value="en">English (en)</option>
    <option value="fr">Français (fr)</option>
  </select>
</div>

<!-- Selector Grande (select-lg) -->
<div class="select-wrapper select-w-lg">
  <select class="form-select-custom select-lg" aria-label="Selector Grande">
    <option value="lg">Grande (select-lg)</option>
    <option value="es">Español (es)</option>
    <option value="en">English (en)</option>
    <option value="de">Deutsch (de)</option>
  </select>
</div>

<!-- 2. Personalización de Ancho -->
<!-- Ancho Completo (select-w-full) -->
<div class="select-wrapper select-w-full" style="margin-top: 14px;">
  <select class="form-select-custom select-w-full" aria-label="Ancho Completo 100%">
    <option value="full">Ancho Completo 100% (select-w-full)</option>
    <option value="1">Opción 1</option>
    <option value="2">Opción 2</option>
  </select>
</div>

<!-- Ancho Personalizado mediante variable CSS inline (--select-width: 320px) -->
<div class="select-wrapper" style="--select-width: 320px; margin-top: 14px;">
  <select class="form-select-custom" style="--select-width: 320px;" aria-label="Ancho Personalizado 320px">
    <option value="custom">Ancho Personalizado (320px)</option>
    <option value="1">Opción A</option>
    <option value="2">Opción B</option>
  </select>
</div>

<!-- 3. Selector de Voces Humanas con Optgroups -->

</div>
