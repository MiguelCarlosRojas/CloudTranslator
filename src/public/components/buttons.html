<!-- Catálogo de Componentes UI Reutilizables: Botones -->
<!-- Botón Primario -->
<button class="btn btn-primary" type="button">
  <span>Acción Principal</span>
</button>

<!-- Botón Secundario (Glow) -->
<button class="btn btn-secondary" type="button">
  <span>Acción Secundaria</span>
</button>

<!-- Botón Outline -->
<button class="btn btn-outline" type="button">
  <span>Acción Neutra</span>
</button>

<!-- Botón de Idioma Inglés con Icono de Globo -->
<button class="btn btn-english" type="button">
  <svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 2a14.5 14.5 0 0 0 0 20M12 2a14.5 14.5 0 0 1 0 20M2 12h20"/></svg>
  English
</button>

<!-- Botón de Peligro / Eliminar Papelera con Tooltip Animado -->
<button class="btn-icon-danger" type="button" aria-label="Eliminar elemento">
  <svg class="icon" viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg>
  <span class="tooltip-text">Eliminar</span>
</button>
