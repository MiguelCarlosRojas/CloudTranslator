<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Separador de Voz e Instrumental de CloudTranslator (Pilar 05) | Aísla la voz (Acapella) y la pista instrumental (Karaoke) de cualquier enlace o archivo de audio/video.">
  <meta property="og:title" content="Separador de Voz e Instrumental (Acapella / Karaoke) - CloudTranslator">
  <meta property="og:description" content="Quita y separa la voz de cualquier canción o video de YouTube, TikTok, o subiendo tu archivo. Descarga voz e instrumental por separado.">
  <title>Separador de Voz e Instrumental (Acapella / Karaoke) - CloudTranslator</title>
  <link rel="icon" type="image/png" sizes="192x192" href="/img/logo.png">
  <link rel="icon" type="image/png" sizes="64x64" href="/img/logo.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/img/logo.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/img/logo.png">
  <link rel="stylesheet" href="/css/style.css">
  <script>
    (function(){try{var m=document.cookie.match(/(?:^|; )cloud_translator_lang=([^;]*)/);var l=m?decodeURIComponent(m[1]):null;if(l&&l!=="original"&&l!=="es"){document.documentElement.classList.add("ct-pending");setTimeout(function(){document.documentElement.classList.remove("ct-pending");},800);}}catch(e){}})();
  </script>
  <script src="/js/spa-router.js" defer></script>
  <script src="/components/components.js" defer></script>
  <style>
    .stem-mode-tabs {
      display: flex;
      gap: 12px;
      margin-bottom: 24px;
      border-bottom: 1px solid var(--border-subtle);
      padding-bottom: 14px;
      flex-wrap: wrap;
    }
    .stem-tab-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 20px;
      border-radius: var(--radius-md);
      font-size: 0.9rem;
      font-weight: 700;
      cursor: pointer;
      background: rgba(18, 22, 34, 0.7);
      border: 1px solid var(--border-subtle);
      color: var(--text-secondary);
      transition: all 0.25s ease;
    }
    .stem-tab-btn:hover {
      border-color: var(--border-focus);
      color: #ffffff;
    }
    .stem-tab-btn.active {
      background: rgba(0, 240, 255, 0.12);
      border-color: var(--primary);
      color: #ffffff;
      box-shadow: 0 0 16px rgba(0, 240, 255, 0.2);
    }
    .drop-zone {
      border: 2px dashed rgba(0, 240, 255, 0.35);
      border-radius: 12px;
      padding: 36px 20px;
      text-align: center;
      background: rgba(10, 14, 24, 0.6);
      cursor: pointer;
      transition: all 0.25s ease;
    }
    .drop-zone:hover, .drop-zone.dragover {
      border-color: var(--primary);
      background: rgba(0, 240, 255, 0.08);
      box-shadow: 0 0 24px rgba(0, 240, 255, 0.15);
    }
    .stem-channel-card {
      background: rgba(14, 18, 30, 0.9);
      border: 1px solid var(--border-subtle);
      border-radius: 14px;
      padding: 20px;
      margin-bottom: 18px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
      position: relative;
      overflow: hidden;
      transition: border-color 0.2s ease;
    }
    .stem-channel-card.vocals {
      border-left: 4px solid #ff007b;
    }
    .stem-channel-card.instrumental {
      border-left: 4px solid #00f0ff;
    }
    .channel-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 14px;
    }
    .channel-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.78rem;
      font-weight: 800;
      letter-spacing: 0.08em;
      padding: 5px 12px;
      border-radius: 20px;
      text-transform: uppercase;
    }
    .channel-badge.vocals {
      background: rgba(255, 0, 123, 0.15);
      color: #ff007b;
      border: 1px solid rgba(255, 0, 123, 0.4);
    }
    .channel-badge.instrumental {
      background: rgba(0, 240, 255, 0.15);
      color: #00f0ff;
      border: 1px solid rgba(0, 240, 255, 0.4);
    }
    .channel-controls {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }
    .volume-slider-box {
      display: flex;
      align-items: center;
      gap: 10px;
      background: rgba(0, 0, 0, 0.4);
      padding: 6px 14px;
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .volume-slider {
      -webkit-appearance: none;
      width: 100px;
      height: 6px;
      border-radius: 3px;
      background: rgba(255, 255, 255, 0.2);
      outline: none;
    }
    .volume-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 15px;
      height: 15px;
      border-radius: 50%;
      background: var(--primary);
      cursor: pointer;
      box-shadow: 0 0 10px var(--primary);
    }
    .wave-visualizer {
      display: flex;
      align-items: center;
      gap: 3px;
      height: 38px;
      width: 100%;
      margin: 12px 0;
      padding: 0 6px;
      background: rgba(0, 0, 0, 0.35);
      border-radius: 8px;
      overflow: hidden;
    }
    .wave-bar {
      flex: 1;
      height: 20%;
      background: rgba(0, 240, 255, 0.3);
      border-radius: 2px;
      transition: height 0.15s ease, background 0.15s ease;
    }
    .wave-visualizer.playing.vocals .wave-bar {
      background: rgba(255, 0, 123, 0.85);
      animation: pulseVocal 0.8s infinite alternate ease-in-out;
    }
    .wave-visualizer.playing.instrumental .wave-bar {
      background: rgba(0, 240, 255, 0.85);
      animation: pulseInst 0.7s infinite alternate ease-in-out;
    }
    @keyframes pulseVocal {
      0% { height: 15%; }
      50% { height: 85%; }
      100% { height: 35%; }
    }
    @keyframes pulseInst {
      0% { height: 25%; }
      50% { height: 95%; }
      100% { height: 45%; }
    }
    .master-player-bar {
      display: flex;
      align-items: center;
      gap: 16px;
      background: rgba(8, 10, 18, 0.95);
      border: 1px solid var(--border-subtle);
      border-radius: 12px;
      padding: 14px 20px;
      margin-bottom: 20px;
    }
    .btn-stem-play {
      width: 46px;
      height: 46px;
      border-radius: 50%;
      background: var(--primary);
      color: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      border: none;
      cursor: pointer;
      box-shadow: 0 0 16px rgba(0, 240, 255, 0.4);
      transition: transform 0.2s ease;
      flex-shrink: 0;
    }
    .btn-stem-play:hover {
      transform: scale(1.08);
    }
    .mode-listen-btn {
      flex: 1;
      min-width: 150px;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 0 16px;
      border-radius: var(--radius-md);
      font-weight: 700;
      font-size: 0.9rem;
      cursor: pointer;
      border: 1px solid var(--border-subtle);
      background: rgba(10, 12, 18, 0.9);
      color: var(--text-secondary);
      transition: all 0.2s ease;
    }
    .mode-listen-btn:hover {
      border-color: var(--border-focus);
      color: #ffffff;
    }
    .mode-listen-btn.active {
      border-color: var(--primary);
      background: rgba(0, 240, 255, 0.15);
      color: #ffffff;
      box-shadow: 0 0 14px rgba(0, 240, 255, 0.25);
    }
    .mode-listen-btn.active.mode-voc {
      border-color: #ff007b;
      background: rgba(255, 0, 123, 0.15);
      box-shadow: 0 0 14px rgba(255, 0, 123, 0.25);
    }
  </style>
</head>
<body>

  <!-- Pie de Página Modular (Componente Centralizado) -->
  <footer id="footer-placeholder" data-component="footer" data-active="vocal-remover"></footer>

  <!-- Audio elements ocultos para sincronización -->
  <audio id="audio-inst" preload="auto"></audio>
  <audio id="audio-voc" preload="auto"></audio>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      // Pestañas
      const tabUrl = document.getElementById("tab-mode-url");
      const tabFile = document.getElementById("tab-mode-file");
      const panelUrl = document.getElementById("panel-url");
      const panelFile = document.getElementById("panel-file");
      const platformsBox = document.getElementById("platforms-selector-box");

      let currentMode = "url";
      let selectedFileBase64 = null;
      let selectedFileName = "";

      tabUrl.addEventListener("click", () => {
        currentMode = "url";
        tabUrl.classList.add("active");
        tabFile.classList.remove("active");
        panelUrl.style.display = "block";
        panelFile.style.display = "none";
        if (platformsBox) platformsBox.style.display = "block";
      });

      tabFile.addEventListener("click", () => {
        currentMode = "file";
        tabFile.classList.add("active");
        tabUrl.classList.remove("active");
        panelFile.style.display = "block";
        panelUrl.style.display = "none";
        if (platformsBox) platformsBox.style.display = "none";
      });

      // Manejo de archivo local
      const dropZone = document.getElementById("drop-zone");
      const fileInput = document.getElementById("file-input");
      const fileInfo = document.getElementById("file-info-badge");
      const fileNameEl = document.getElementById("file-info-name");
      const btnRemoveFile = document.getElementById("btn-remove-file");

      dropZone.addEventListener("click", () => fileInput.click());
      dropZone.addEventListener("dragover", (e) => { e.preventDefault(); dropZone.classList.add("dragover"); });
      dropZone.addEventListener("dragleave", () => dropZone.classList.remove("dragover"));
      dropZone.addEventListener("drop", (e) => {
        e.preventDefault();
        dropZone.classList.remove("dragover");
        if (e.dataTransfer.files.length) handleFile(e.dataTransfer.files[0]);
      });

      fileInput.addEventListener("change", () => {
        if (fileInput.files.length) handleFile(fileInput.files[0]);
      });

      function handleFile(file) {
        if (!file) return;
        selectedFileName = file.name;
        fileNameEl.textContent = file.name;
        fileInfo.style.display = "flex";
        dropZone.style.display = "none";

        const reader = new FileReader();
        reader.onload = (e) => {
          selectedFileBase64 = e.target.result;
        };
        reader.readAsDataURL(file);
      }

      btnRemoveFile.addEventListener("click", () => {
        selectedFileBase64 = null;
        selectedFileName = "";
        fileInput.value = "";
        fileInfo.style.display = "none";
        dropZone.style.display = "block";
      });

      // Detección automática de plataformas
      const inputUrl = document.getElementById("input-media-url");
      const btnClear = document.getElementById("btn-clear-url");
      const platformHoverLabel = document.getElementById("platform-hover-label");
      const detectedPlatformBadge = document.getElementById("detected-platform-badge");

      const platformNames = {
        youtube: "YouTube",
        tiktok: "TikTok",
        instagram: "Instagram",
        facebook: "Facebook",
        twitter: "Twitter / X",
        pinterest: "Pinterest",
        direct: "Enlace Directo"
      };

      function detectPlatformFromUrl(url) {
        const u = (url || "").trim().toLowerCase();
        if (!u) return null;
        if (u.includes("youtube.com") || u.includes("youtu.be")) return "youtube";
        if (u.includes("tiktok.com")) return "tiktok";
        if (u.includes("instagram.com")) return "instagram";
        if (u.includes("facebook.com") || u.includes("fb.watch")) return "facebook";
        if (u.includes("twitter.com") || u.includes("x.com")) return "twitter";
        if (u.includes("pinterest.com") || u.includes("pin.it")) return "pinterest";
        if (u.startsWith("http://") || u.startsWith("https://")) return "direct";
        return null;
      }

      function syncDetectedPlatform(url) {
        const detected = detectPlatformFromUrl(url);
        document.querySelectorAll(".platform-chip").forEach(c => {
          if (detected && c.getAttribute("data-platform") === detected) {
            c.classList.add("active");
          } else {
            c.classList.remove("active");
          }
        });

        if (detected && platformNames[detected]) {
          if (detectedPlatformBadge) detectedPlatformBadge.textContent = `${platformNames[detected]} DETECTADO`;
          if (platformHoverLabel) platformHoverLabel.textContent = platformNames[detected];
        } else {
          if (detectedPlatformBadge) detectedPlatformBadge.textContent = "DETECCIÓN AUTOMÁTICA";
          if (platformHoverLabel) platformHoverLabel.textContent = "7 PLATAFORMAS";
        }
      }

      inputUrl.addEventListener("input", () => {
        syncDetectedPlatform(inputUrl.value);
      });

      btnClear.addEventListener("click", () => {
        inputUrl.value = "";
        syncDetectedPlatform("");
        inputUrl.focus();
      });

      // Clic en chips de plataforma solo enfoca el campo de texto (sin rellenar URL por defecto)
      document.querySelectorAll(".platform-chip").forEach(chip => {
        chip.addEventListener("click", () => {
          inputUrl.focus();
        });
      });

      // Generar barras decorativas para visualizadores
      ["viz-inst", "viz-voc"].forEach(id => {
        const box = document.getElementById(id);
        if (!box) return;
        for (let i = 0; i < 45; i++) {
          const bar = document.createElement("div");
          bar.className = "wave-bar";
          bar.style.height = `${Math.floor(Math.random() * 65 + 15)}%`;
          box.appendChild(bar);
        }
      });

      // Procesar Separación
      const btnProcess = document.getElementById("btn-process-split");
      const progressBox = document.getElementById("progress-box");
      const progressBar = document.getElementById("progress-bar");
      const progressPercent = document.getElementById("progress-percent");
      const progressStatus = document.getElementById("progress-status");
      const resultBox = document.getElementById("result-box");

      const audioInst = document.getElementById("audio-inst");
      const audioVoc = document.getElementById("audio-voc");

      btnProcess.addEventListener("click", async () => {
        const quality = document.getElementById("select-quality").value;

        let payload = { quality };
        if (currentMode === "url") {
          const u = inputUrl.value.trim();
          if (!u) {
            alert("Introduce un enlace multimedia válido.");
            return;
          }
          payload.url = u;
        } else {
          if (!selectedFileBase64) {
            alert("Por favor selecciona o arrastra un archivo de audio/video.");
            return;
          }
          payload.audioBase64 = selectedFileBase64;
          payload.filename = selectedFileName;
        }

        // Reset
        audioInst.pause();
        audioVoc.pause();
        resultBox.style.display = "none";
        btnProcess.disabled = true;
        progressBox.style.display = "block";
        progressBar.style.width = "20%";
        progressPercent.textContent = "20%";
        progressStatus.innerHTML = `<span class="spinner" style="display: inline-block; width: 14px; height: 14px;"></span> Extrayendo audio maestro de alta fidelidad...`;

        try {
          const t1 = setTimeout(() => {
            progressBar.style.width = "45%";
            progressPercent.textContent = "45%";
            progressStatus.innerHTML = `<span class="spinner" style="display: inline-block; width: 14px; height: 14px;"></span> Conectando con red neuronal Demucs v4 (Meta AI)...`;
          }, 1000);

          const t2 = setTimeout(() => {
            progressBar.style.width = "75%";
            progressPercent.textContent = "75%";
            progressStatus.innerHTML = `<span class="spinner" style="display: inline-block; width: 14px; height: 14px;"></span> Extrayendo acapella y pista instrumental pura sin filtraciones...`;
          }, 3500);

          const res = await fetch("/api/separator/process", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload)
          });
          clearTimeout(t1);
          clearTimeout(t2);
          const data = await res.json();

          progressBar.style.width = "100%";
          progressPercent.textContent = "100%";

          if (data.status === "success") {
            progressStatus.textContent = "Separación neuronal completada con éxito";
            displaySeparationResult(data);
          } else {
            alert(data.error || "No se pudo procesar la separación.");
          }
        } catch (err) {
          alert("Error de red: " + err.message);
        } finally {
          btnProcess.disabled = false;
        }
      });

      function displaySeparationResult(data) {
        resultBox.style.display = "block";
        document.getElementById("res-title").textContent = data.title;
        document.getElementById("res-platform").textContent = data.platform;
        document.getElementById("res-duration").textContent = data.duration;
        document.getElementById("time-total").textContent = data.duration;
        document.getElementById("res-thumb").src = data.thumbnail || "/img/logo.png";

        const badgeStem = document.getElementById("res-stem-badge");
        if (badgeStem && data.engine) {
          badgeStem.innerHTML = `<svg class="icon" viewBox="0 0 24 24" style="width: 14px; height: 14px;"><polyline points="20 6 9 17 4 12"/></svg> ${data.engine.toUpperCase()}`;
        }

        // Configurar fuentes de audio
        audioInst.src = data.instrumental.streamUrl;
        audioVoc.src = data.vocals.streamUrl;

        // Configurar botones de descarga directa
        const btnDlInst = document.getElementById("btn-dl-inst");
        btnDlInst.href = data.instrumental.downloadUrl;
        btnDlInst.setAttribute("download", data.instrumental.filename);

        const btnDlVoc = document.getElementById("btn-dl-voc");
        btnDlVoc.href = data.vocals.downloadUrl;
        btnDlVoc.setAttribute("download", data.vocals.filename);

        audioInst.load();
        audioVoc.load();

        // Modo por defecto al renderizar: Solo Instrumental
        applyListeningMode("inst");

        resultBox.scrollIntoView({ behavior: "smooth", block: "nearest" });
      }

      // Selector Interactivo de Modo de Escucha: Solo Instrumental / Solo Voz / Ambos
      const btnModeInst = document.getElementById("btn-mode-inst");
      const btnModeVoc = document.getElementById("btn-mode-voc");
      const btnModeBoth = document.getElementById("btn-mode-both");
      const currentListenLabel = document.getElementById("current-listen-label");

      const volInst = document.getElementById("vol-inst");
      const volVoc = document.getElementById("vol-voc");
      const volInstText = document.getElementById("vol-inst-text");
      const volVocText = document.getElementById("vol-voc-text");
      const btnMuteInst = document.getElementById("btn-mute-inst");
      const btnMuteVoc = document.getElementById("btn-mute-voc");

      function applyListeningMode(mode) {
        btnModeInst.classList.remove("active");
        btnModeVoc.classList.remove("active");
        btnModeBoth.classList.remove("active");

        if (mode === "inst") {
          btnModeInst.classList.add("active");
          currentListenLabel.textContent = "SOLO INSTRUMENTAL (KARAOKE)";
          audioInst.muted = false;
          audioVoc.muted = true;
          btnMuteInst.textContent = "Mute";
          btnMuteInst.style.color = "";
          btnMuteVoc.textContent = "Silenciado";
          btnMuteVoc.style.color = "#ff4d4d";
        } else if (mode === "voc") {
          btnModeVoc.classList.add("active");
          currentListenLabel.textContent = "SOLO VOZ (ACAPELLA)";
          audioVoc.muted = false;
          audioInst.muted = true;
          btnMuteVoc.textContent = "Mute";
          btnMuteVoc.style.color = "";
          btnMuteInst.textContent = "Silenciado";
          btnMuteInst.style.color = "#ff4d4d";
        } else if (mode === "both") {
          btnModeBoth.classList.add("active");
          currentListenLabel.textContent = "AMBOS SINCRONIZADOS";
          audioInst.muted = false;
          audioVoc.muted = false;
          btnMuteInst.textContent = "Mute";
          btnMuteInst.style.color = "";
          btnMuteVoc.textContent = "Mute";
          btnMuteVoc.style.color = "";
        }
      }

      btnModeInst.addEventListener("click", () => applyListeningMode("inst"));
      btnModeVoc.addEventListener("click", () => applyListeningMode("voc"));
      btnModeBoth.addEventListener("click", () => applyListeningMode("both"));

      // Controles del Reproductor Sincronizado
      const btnMasterPlay = document.getElementById("btn-master-play");
      const masterIcon = document.getElementById("master-play-icon");
      const masterScrubber = document.getElementById("master-scrubber");
      const timeCurrent = document.getElementById("time-current");
      const vizInst = document.getElementById("viz-inst");
      const vizVoc = document.getElementById("viz-voc");

      let isPlaying = false;

      function updateMasterPlayState(playing) {
        isPlaying = playing;
        if (playing) {
          masterIcon.innerHTML = `<rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/>`;
          vizInst.classList.add("playing");
          vizVoc.classList.add("playing");
        } else {
          masterIcon.innerHTML = `<polygon points="5 3 19 12 5 21 5 3"/>`;
          vizInst.classList.remove("playing");
          vizVoc.classList.remove("playing");
        }
      }

      btnMasterPlay.addEventListener("click", () => {
        if (isPlaying) {
          audioInst.pause();
          audioVoc.pause();
          updateMasterPlayState(false);
        } else {
          audioVoc.currentTime = audioInst.currentTime;
          Promise.all([audioInst.play(), audioVoc.play()]).then(() => {
            updateMasterPlayState(true);
          }).catch(console.error);
        }
      });

      // Actualizar tiempo y scrubber
      audioInst.addEventListener("timeupdate", () => {
        if (!audioInst.duration) return;
        const pct = (audioInst.currentTime / audioInst.duration) * 100;
        masterScrubber.value = pct;
        const curM = Math.floor(audioInst.currentTime / 60);
        const curS = Math.floor(audioInst.currentTime % 60);
        timeCurrent.textContent = `${String(curM).padStart(2, "0")}:${String(curS).padStart(2, "0")}`;
      });

      masterScrubber.addEventListener("input", () => {
        if (!audioInst.duration) return;
        const newTime = (masterScrubber.value / 100) * audioInst.duration;
        audioInst.currentTime = newTime;
        audioVoc.currentTime = newTime;
      });

      audioInst.addEventListener("ended", () => {
        updateMasterPlayState(false);
      });

      // Faders de volumen individuales
      volInst.addEventListener("input", () => {
        audioInst.volume = volInst.value;
        volInstText.textContent = `${Math.round(volInst.value * 100)}%`;
      });

      volVoc.addEventListener("input", () => {
        audioVoc.volume = volVoc.value;
        volVocText.textContent = `${Math.round(volVoc.value * 100)}%`;
      });

      btnMuteInst.addEventListener("click", () => {
        audioInst.muted = !audioInst.muted;
        btnMuteInst.textContent = audioInst.muted ? "Desmutear" : "Mute";
        btnMuteInst.style.color = audioInst.muted ? "#ff4d4d" : "";
      });

      btnMuteVoc.addEventListener("click", () => {
        audioVoc.muted = !audioVoc.muted;
        btnMuteVoc.textContent = audioVoc.muted ? "Desmutear" : "Mute";
        btnMuteVoc.style.color = audioVoc.muted ? "#ff4d4d" : "";
      });
    });
  </script>
</body>
</html>
